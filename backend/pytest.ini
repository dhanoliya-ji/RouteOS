# pytest configuration.
#
# The whole suite runs without a database, a network or a server — see
# tests/README.md for what that covers and what it leaves untested.
[pytest]
# Only look in tests/. Without this, pytest would also try to collect from
# scripts/ and app/, where a module named like a test could be imported
# unexpectedly.
testpaths = tests

python_files = test_*.py

# Treat every `async def` test as a coroutine to run, with no
# @pytest.mark.asyncio decorator needed. Nothing in the suite is async today;
# this is what lets one be added without ceremony.
#
# NOTE: the modern companion setting is asyncio_default_fixture_loop_scope,
# which replaces the deprecated event_loop fixture override in
# tests/conftest.py.
asyncio_mode = auto

# -ra prints a short summary of everything that was not a plain pass —
# failures, errors, skips and xfails — so a skipped OR-Tools suite is visible
# rather than looking like a clean run.
addopts = -ra
