# pytest configuration.
#
# The suite has two tiers. Tier 1 needs nothing and always runs; Tier 2 needs a
# real PostGIS database and SKIPS cleanly without one, so `pytest` works on a
# machine with no Docker. See tests/README.md, and tests/conftest.py for the
# container command.
[pytest]
# Only look in tests/. Without this, pytest would also try to collect from
# scripts/ and app/, where a module named like a test could be imported
# unexpectedly.
testpaths = tests

python_files = test_*.py

# Treat every `async def` test as a coroutine to run, with no
# @pytest.mark.asyncio decorator needed. The DB-backed tests rely on this.
asyncio_mode = auto

# The modern replacement for overriding the `event_loop` fixture, which is
# deprecated in pytest-asyncio 0.25. "function" gives each test its own loop,
# which is what keeps one test's engine state from leaking into the next.
asyncio_default_fixture_loop_scope = function

# -ra prints a short summary of everything that was not a plain pass —
# failures, errors, skips and xfails. That matters more now than it did: it is
# how a skipped Tier 2 shows up, instead of looking like a clean full run.
addopts = -ra
