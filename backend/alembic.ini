# Alembic configuration.
#
# Deliberately minimal: the interesting decisions are in alembic/env.py, which
# is what fills in the database URL and the target metadata. See
# alembic/README.md.

[alembic]
# Where the migration scripts and env.py live, relative to this file.
script_location = alembic

# Put the CURRENT directory on sys.path, so env.py and the migrations can
# `import app.*`. Without this, running alembic from backend/ would fail to
# find the application package at all.
prepend_sys_path = .

# INTENTIONALLY BLANK.
#
# env.py sets this at runtime from Settings.database_url_sync, which keeps one
# source of truth (change DATABASE_URL and both the app and the migrations
# follow) and keeps the database password out of a committed file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING rather than INFO: at INFO SQLAlchemy logs every statement it emits,
# which during a migration buries Alembic's own output.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO so Alembic reports each revision as it is applied — this is the output
# you actually want to read during a deploy.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# stderr, not stdout, so migration logging stays separate from the SQL that
# `alembic upgrade --sql` writes to stdout — otherwise a generated script would
# be polluted with log lines.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
