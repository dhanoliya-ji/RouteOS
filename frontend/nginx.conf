# nginx config for the production image, which serves the built static bundle.
#
# Only two rules matter: the SPA fallback, and asset caching.
server {
    listen 80;
    # Catch-all: the container does not know the hostname it will be served
    # under, and TLS is terminated upstream.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all client routes resolve to index.html
    #
    # This is what makes client-side routing survive a refresh. React Router
    # owns paths like /orders and /planner, but those directories do not exist
    # on disk — without this rule, reloading /orders would be a plain 404.
    # try_files serves the real file if there is one, otherwise hands index.html
    # to the browser and lets the router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get a 7-day cache. Safe because Vite puts a content hash in
    # every filename, so a rebuild produces new names and a stale cache can
    # never serve the wrong version.
    #
    # Note index.html is deliberately NOT matched here — it must stay
    # uncached, since it is the file that points at the hashed asset names.
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
