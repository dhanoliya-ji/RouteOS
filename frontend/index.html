<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RouteOS — Fleet Optimization</title>
    <!-- Leaflet's stylesheet, from a CDN rather than bundled. The integrity
         hash pins the exact file, so a compromised CDN cannot substitute
         different CSS. Note this makes the maps depend on an external
         request; bundling it via npm would remove that. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <!-- preconnect opens the TCP/TLS handshake early, so the font request
         below does not pay for it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The single mount point. src/main.tsx asserts this exists. -->
    <div id="root"></div>
    <!-- Vite rewrites this to the hashed bundle at build time. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
